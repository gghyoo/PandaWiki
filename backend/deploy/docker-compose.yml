services:
  # ──────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────

  panda-wiki-postgres:
    container_name: panda-wiki-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: panda-wiki
    volumes:
      - panda-wiki-postgres:/var/lib/postgresql/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.11"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  panda-wiki-redis:
    container_name: panda-wiki-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - panda-wiki-redis:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.14"

  panda-wiki-nats:
    container_name: panda-wiki-nats
    image: nats:2-alpine
    restart: always
    command: "-js --user panda-wiki --pass ${NATS_PASSWORD}"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.13"

  panda-wiki-minio:
    container_name: panda-wiki-minio
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: s3panda-wiki
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - panda-wiki-minio:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.12"

  # ──────────────────────────────────────────
  # RAG service
  # ──────────────────────────────────────────

  panda-wiki-raglite:
    container_name: panda-wiki-raglite
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-raglite:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-minio:
        condition: service_started
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.18"

  # ──────────────────────────────────────────
  # Reverse proxy (Caddy)
  # ──────────────────────────────────────────

  panda-wiki-caddy:
    container_name: panda-wiki-caddy
    image: caddy:2-alpine
    restart: always
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - panda-wiki-caddy:/data
      - panda-wiki-run:/app/run
    # Expose standard HTTP/HTTPS ports.
    # Add more ports here if your knowledge bases use custom ports,
    # e.g. "- 8443:8443"
    ports:
      - "80:80"
      - "443:443"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.1"

  # ──────────────────────────────────────────
  # Backend services
  # ──────────────────────────────────────────

  panda-wiki-api:
    container_name: panda-wiki-api
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-api:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SUBNET_PREFIX: ${SUBNET_PREFIX}
    volumes:
      - panda-wiki-ssl:/app/etc/nginx/ssl
      - panda-wiki-run:/app/run
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-nats:
        condition: service_started
      panda-wiki-redis:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
      panda-wiki-raglite:
        condition: service_started
      panda-wiki-caddy:
        condition: service_started
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.2"

  panda-wiki-consumer:
    container_name: panda-wiki-consumer
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-consumer:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SUBNET_PREFIX: ${SUBNET_PREFIX}
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-nats:
        condition: service_started
      panda-wiki-redis:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
      panda-wiki-raglite:
        condition: service_started
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.15"

  # ──────────────────────────────────────────
  # Frontend services
  # ──────────────────────────────────────────

  panda-wiki-app:
    container_name: panda-wiki-app
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-app:latest
    restart: always
    environment:
      # Used by the Next.js middleware to proxy share/API requests server-side
      TARGET: "http://${SUBNET_PREFIX}.2:8000"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.112"

  panda-wiki-nginx:
    container_name: panda-wiki-nginx
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-nginx:latest
    restart: always
    volumes:
      # Share the SSL certificate directory so nginx uses the cert generated by the API
      - panda-wiki-ssl:/etc/nginx/ssl
    ports:
      - "${ADMIN_PORT}:8080"
    depends_on:
      - panda-wiki-api
      - panda-wiki-minio
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.111"

networks:
  panda-wiki:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET_PREFIX}.0/24"
          gateway: "${SUBNET_PREFIX}.254"

volumes:
  panda-wiki-postgres:
  panda-wiki-redis:
  panda-wiki-minio:
  panda-wiki-caddy:
  panda-wiki-run:
  panda-wiki-ssl:
