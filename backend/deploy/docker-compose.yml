services:
  # ──────────────────────────────────────────
  # 基础设施（使用官方镜像，无源码）
  # ──────────────────────────────────────────

  panda-wiki-postgres:
    container_name: panda-wiki-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: panda-wiki
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.11"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  panda-wiki-redis:
    container_name: panda-wiki-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.14"

  panda-wiki-nats:
    container_name: panda-wiki-nats
    image: nats:2-alpine
    restart: always
    command: "-js --user panda-wiki --pass ${NATS_PASSWORD}"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.13"

  panda-wiki-minio:
    container_name: panda-wiki-minio
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: s3panda-wiki
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - ./data/minio:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.12"

  # ──────────────────────────────────────────
  # RAG 服务（官方镜像，仓库中无对应源码）
  # ──────────────────────────────────────────

  panda-wiki-raglite:
    container_name: panda-wiki-raglite
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-raglite:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-minio:
        condition: service_started
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.18"

  # ──────────────────────────────────────────
  # 反向代理（官方镜像，仅需配置文件）
  # ──────────────────────────────────────────

  panda-wiki-caddy:
    container_name: panda-wiki-caddy
    image: caddy:2-alpine
    restart: always
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/run:/app/run
    # 暴露标准 HTTP/HTTPS 端口。
    # 若知识库使用了自定义端口，请在此追加，如：
    #   - "8443:8443"
    ports:
      - "80:80"
      - "443:443"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.1"

  # ──────────────────────────────────────────
  # 后端服务（从本仓库源码构建）
  # ──────────────────────────────────────────

  panda-wiki-api:
    container_name: panda-wiki-api
    build:
      context: ../
      dockerfile: Dockerfile.api
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SUBNET_PREFIX: ${SUBNET_PREFIX}
    volumes:
      - ./data/ssl:/app/etc/nginx/ssl
      - ./data/run:/app/run
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-nats:
        condition: service_started
      panda-wiki-redis:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
      panda-wiki-raglite:
        condition: service_started
      panda-wiki-caddy:
        condition: service_started
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.2"

  panda-wiki-consumer:
    container_name: panda-wiki-consumer
    build:
      context: ../
      dockerfile: Dockerfile.consumer
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SUBNET_PREFIX: ${SUBNET_PREFIX}
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-nats:
        condition: service_started
      panda-wiki-redis:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
      panda-wiki-raglite:
        condition: service_started
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.15"

  # ──────────────────────────────────────────
  # 前端服务（从本仓库源码构建）
  # ──────────────────────────────────────────

  panda-wiki-app:
    container_name: panda-wiki-app
    build:
      context: ../../web
      dockerfile: app/Dockerfile.build
    restart: always
    environment:
      # Next.js 中间件用此地址在服务端代理 share/API 请求
      TARGET: "http://${SUBNET_PREFIX}.2:8000"
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.112"

  panda-wiki-nginx:
    container_name: panda-wiki-nginx
    build:
      context: ../../web
      dockerfile: admin/Dockerfile.build
    restart: always
    volumes:
      # 与 API 共享 SSL 证书目录：API 生成证书后 nginx 即可使用真实证书
      - ./data/ssl:/etc/nginx/ssl
    ports:
      - "${ADMIN_PORT}:8080"
    depends_on:
      - panda-wiki-api
      - panda-wiki-minio
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.111"

networks:
  panda-wiki:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET_PREFIX}.0/24"
          gateway: "${SUBNET_PREFIX}.254"
